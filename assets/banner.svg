<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Persona Portfolio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0304"/><stop offset="100%" stop-color="#120508"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e10600"/><stop offset="100%" stop-color="#ff5f56"/>
    </linearGradient>
    <style>
      .sans { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: Consolas, Menlo, Monaco, monospace; }
    </style>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>
  <!-- angular persona shards -->
  <polygon points="1140,40 1180,40 1120,120 1088,120" fill="#e10600" opacity="0.85"/>
  <polygon points="1090,150 1150,150 1110,240 1060,240" fill="#e10600" opacity="0.5"/>

  <!-- stylized star/mask motif -->
  <path d="M1010 150 l14 -44 l14 44 l46 0 l-37 27 l14 44 l-37 -27 l-37 27 l14 -44 l-37 -27 z"
        fill="none" stroke="#ff5f56" stroke-width="2.2" stroke-linejoin="round"/>

  <text x="64" y="112" class="sans" font-size="48" font-weight="800" fill="#f5f5f5">Persona Portfolio</text>
  <text x="66" y="154" class="mono" font-size="19" fill="#c9a0a0">A Persona 5–inspired personal portfolio site —</text>
  <text x="66" y="180" class="mono" font-size="19" fill="#c9a0a0">bold motion design, themed page-by-page</text>

  <g class="mono" font-size="15" fill="#b08a8a">
    <text x="66" y="234">Astro</text><text x="140" y="234" fill="#5a2b2b">|</text>
    <text x="160" y="234">React</text><text x="240" y="234" fill="#5a2b2b">|</text>
    <text x="260" y="234">TypeScript</text><text x="385" y="234" fill="#5a2b2b">|</text>
    <text x="405" y="234">Tailwind</text><text x="510" y="234" fill="#5a2b2b">|</text>
    <text x="530" y="234">Framer Motion</text>
  </g>
  <text x="66" y="276" class="mono" font-size="13" fill="#6e4a4a">Front-end + motion design · github.com/ayushdeo</text>
</svg>
